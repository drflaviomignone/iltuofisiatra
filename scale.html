const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw,salt){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:IT,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["decrypt"])}
async function dec(buf,pw){const a=new Uint8Array(buf);const k=await key(pw,a.slice(0,16));return crypto.subtle.decrypt({name:"AES-GCM",iv:a.slice(16,28)},k,a.slice(28))}
function hook(pw){
 document.addEventListener("click",async ev=>{
  const a=ev.target.closest&&ev.target.closest("a[href]");if(!a)return;
  let u;try{u=new URL(a.getAttribute("href"),location.href)}catch(x){return}
  if(u.origin!==location.origin||!/\.pdf$/i.test(u.pathname))return;
  ev.preventDefault();const w=window.open("","_blank");
  try{const r=await fetch(u.pathname.split("/").pop()+"?v="+Date.now());const d=await dec(await r.arrayBuffer(),pw);
   const url=URL.createObjectURL(new Blob([d],{type:"application/pdf"}));if(w)w.location=url;else location.href=url}
  catch(x){if(w)w.close();alert("Impossibile aprire il PDF.")}
 },true);
}
async function open_(pw){
 const html=new TextDecoder().decode(await dec(b64(P),pw));
 try{sessionStorage.setItem("ltf_pw",pw)}catch(x){}
 document.open();document.write(html);document.close();hook(pw);
}
const f=document.getElementById("f"),e=document.getElementById("e"),bt=document.getElementById("b");
f.addEventListener("submit",async ev=>{ev.preventDefault();e.textContent="";bt.disabled=true;bt.textContent="Verifica…";
 try{await open_(document.getElementById("pw").value)}catch(x){e.textContent="Password errata.";bt.disabled=false;bt.textContent="Accedi"}});
let s=null;try{s=sessionStorage.getItem("ltf_pw")}catch(x){}
if(s)open_(s).catch(()=>{try{sessionStorage.removeItem("ltf_pw")}catch(x){}});
})();
